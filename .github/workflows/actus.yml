name: Actus YouTube
on:
  schedule:
    - cron: '17 */2 * * *'   # toutes les 2 heures
  workflow_dispatch:
  push:
    paths: ['actus/**', '.github/workflows/actus.yml']
permissions:
  contents: write
concurrency: actus
jobs:
  actus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 actus/actus.py
      - name: Enregistrer si nouveau
        run: |
          git config user.name "Ti rompi"
          git config user.email "noreply@anthropic.com"
          git add data/actus.json data/saints-videos.json 2>/dev/null || git add data/actus.json
          git add data/saints-videos.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          if ! git diff --cached --quiet -- data/saints-videos.json; then git commit -m "Actus : vidéos des saints patrons"; git push; exit 0; fi
          # ne recommiter que si la liste des vidéos a changé (pas seulement l'heure)
          if [ "$(git show HEAD:data/actus.json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); d.pop("maj",None); print(json.dumps(d,sort_keys=True))')" = "$(python3 -c 'import json; d=json.load(open("data/actus.json")); d.pop("maj",None); print(json.dumps(d,sort_keys=True))')" ]; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Actus : nouvelles vidéos"
          git push
